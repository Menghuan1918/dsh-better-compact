<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc"><title id="title">Better Compact 与 Better DSH 的装配关系</title><desc id="desc">Better Compact 由 Better DSH 装配，或独立安装；使用同一稳定行。</desc><defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#E6EDF5" stroke-width="1" opacity="0.7"/></pattern>
<radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#2F80B7" stop-opacity="0.18"/><stop offset="100%" stop-color="#2F80B7" stop-opacity="0"/></radialGradient>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DCE5F0"/></marker>
<marker id="arrowA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F80B7"/></marker>
</defs><rect x="0" y="0" width="1600" height="600" fill="#F6F8FB"/><rect x="0" y="0" width="1600" height="600" fill="url(#grid)" opacity="0.55"/><rect x="0.5" y="0.5" width="1599" height="599" fill="none" stroke="#DCE5F0" stroke-width="1" opacity="0.9"/><text x="80" y="72" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="38" font-weight="700" fill="#0B1524" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">与 Better DSH 的装配关系</text><text x="80" y="110" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="400" fill="#5B6B80" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">同一稳定行；独立安装或由 Better DSH 装配</text><rect x="80" y="150" width="400" height="300" rx="16" fill="#E8F2FA" stroke="#2F80B7" stroke-width="1" opacity="1"/><text x="108" y="190" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="700" fill="#0B1524" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">Better DSH bundle</text><text x="108" y="220" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="400" fill="#14587F" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">dsh-better-dsh</text><circle cx="116" cy="264" r="3.5" fill="#2F80B7" opacity="1"/><text x="132" y="264" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">bundle patch 插入同一行</text><circle cx="116" cy="298" r="3.5" fill="#2F80B7" opacity="1"/><text x="132" y="298" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">精确依赖 / 独立安装</text><circle cx="116" cy="332" r="3.5" fill="#2F80B7" opacity="1"/><text x="132" y="332" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">旧 profile 兼容键保留</text><rect x="108" y="388" width="344" height="34" rx="9" fill="#0F172A" stroke="#DCE5F0" stroke-width="1" opacity="1"/><text x="124" y="405" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="400" fill="#7CC8F2" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">dsh plugin add dsh-better-compact</text><rect x="520" y="150" width="560" height="300" rx="16" fill="#FFFFFF" stroke="#DCE5F0" stroke-width="1" opacity="1"/><rect x="520" y="150" width="560" height="6" rx="3" fill="#D97706"/><text x="548" y="190" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="26" font-weight="700" fill="#0B1524" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">Better Compact</text><text x="548" y="220" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="400" fill="#5B6B80" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">dsh-better-compact</text><rect x="548" y="240" width="190" height="28" rx="14" fill="#F1F5F9" stroke="#DCE5F0" stroke-width="1" opacity="1"/><text x="566" y="254" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="500" fill="#334155" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">dsh-better-compact</text><text x="548" y="300" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#8A99AC" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="1">这个插件拥有</text><circle cx="558" cy="330" r="3.5" fill="#D97706" opacity="1"/><text x="574" y="330" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">native / goal / handoff 模式</text><circle cx="558" cy="358" r="3.5" fill="#D97706" opacity="1"/><text x="574" y="358" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">压缩引擎与预算</text><circle cx="558" cy="386" r="3.5" fill="#D97706" opacity="1"/><text x="574" y="386" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">摘要路由 / 模型策略</text><circle cx="558" cy="414" r="3.5" fill="#D97706" opacity="1"/><text x="574" y="414" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">只读诊断 API</text><rect x="1120" y="150" width="400" height="300" rx="16" fill="#F1F5F9" stroke="#DCE5F0" stroke-width="1" opacity="1"/><text x="1148" y="190" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="700" fill="#0B1524" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">DSH host</text><text x="1148" y="220" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="400" fill="#5B6B80" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">profile / Loader / settings</text><circle cx="1156" cy="264" r="3.5" fill="#2F80B7" opacity="1"/><text x="1172" y="264" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">加载 bundle</text><circle cx="1156" cy="298" r="3.5" fill="#2F80B7" opacity="1"/><text x="1172" y="298" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">注册行 / 工具 / client</text><circle cx="1156" cy="332" r="3.5" fill="#2F80B7" opacity="1"/><text x="1172" y="332" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">设置写回 profile</text><text x="1148" y="396" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="400" fill="#5B6B80" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">设置：模式 / auto / 摘要</text><line x1="480" y1="300" x2="518" y2="300" stroke="#2F80B7" stroke-width="1.5" stroke-dasharray="5 7" marker-end="url(#arrowA)" opacity="1"/><text x="486" y="282" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="400" fill="#5B6B80" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">同一行</text><line x1="1080" y1="300" x2="1118" y2="300" stroke="#2F80B7" stroke-width="1.5" marker-end="url(#arrowA)" opacity="1"/><text x="1086" y="282" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="400" fill="#5B6B80" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">注册</text><rect x="80" y="500" width="1440" height="52" rx="12" fill="#F1F5F9" stroke="#DCE5F0" stroke-width="1" opacity="1"/><text x="104" y="526" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="400" fill="#5B6B80" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">独立安装或随 Better DSH 安装都使用同一行；所有行 id 与设置命名空间保持稳定。</text></svg>
